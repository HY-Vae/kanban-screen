# 看板前端镜像推送到阿里云 ACR
# Secrets：ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
#
# 标签与 compose 默认一致：local（另打一份 sha 便于回溯）

name: Build and push kanban-screen to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: kanban-screen
  IMAGE_TAG: local

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${{ env.IMAGE_TAG }}"
            echo "${IMAGE}:${SHA_SHORT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          pull: false
          tags: ${{ steps.meta.outputs.tags }}
