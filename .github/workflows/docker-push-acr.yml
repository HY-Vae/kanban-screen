# 看板前端镜像推送到阿里云 ACR
# Secrets：ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
#
# 仅 main push 自动构建；手动触发可选镜像前缀

name: Build and push kanban-screen to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Image tag prefix
        type: choice
        options: [dev, rc, prod]
        default: prod

env:
  IMAGE_NAME: kanban-screen

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag prefix
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PREFIX="${{ inputs.env }}"
          else
            PREFIX=prod
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          PREFIX="${{ steps.env.outputs.prefix }}"
          IMAGE="${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${PREFIX}-${SHA_SHORT}"
            echo "${IMAGE}:${PREFIX}-latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          pull: false
          tags: ${{ steps.meta.outputs.tags }}
