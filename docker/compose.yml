name: kanban-screen

# 运行时定义（无 build）。本地默认 tag=local；远程部署复制 docker/.env.example 为 docker/.env 或 export：
#
#   export IMAGE_PREFIX=registry.cn-hangzhou.aliyuncs.com/kiven-z-auth
#   export IMAGE_TAG=local
#   docker compose pull && docker compose up -d --no-build
#
services:
  kanban-screen:
    image: ${IMAGE_PREFIX:-kanban}/kanban-screen:${IMAGE_TAG:-local}
    container_name: kanban-screen
    mem_limit: 64m
    mem_reservation: 16m
    environment:
      TZ: Asia/Shanghai
      GATEWAY_HOST: kanban-gateway
    ports:
      - "18081:80"
    restart: unless-stopped